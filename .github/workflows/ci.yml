name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore Chronicle.sln --disable-parallel /p:BuildInParallel=false

      - name: Build
        run: dotnet build Chronicle.sln --no-restore /m:1 /p:UseSharedCompilation=false /p:BuildInParallel=false

      - name: Test
        run: dotnet test Chronicle.sln --no-build /m:1 /p:BuildInParallel=false
